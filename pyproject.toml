[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-intentional"
version = "0.1.0"
description = "Declarative intent-based automation for Home Assistant"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "tobiash", email = "tobiash@users.noreply.github.com" }
]
keywords = ["home-assistant", "home-automation", "hacs", "intent", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "PyYAML>=6.0",
    "voluptuous>=0.13.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
]
dev = [
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.urls]
Homepage = "https://github.com/tobiash/ha-intentional"
Repository = "https://github.com/tobiash/ha-intentional.git"
Issues = "https://github.com/tobiash/ha-intentional/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
intentional = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.run]
source = ["src/intentional"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["custom_components", "tests/fixtures"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM",
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (used in voluptuous schemas)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011"]

[tool.mypy]
python_version = "3.11"
ignore_errors = true   # we use dynamic types by design; types are a future improvement
follow_imports = "silent"
ignore_missing_imports = true
