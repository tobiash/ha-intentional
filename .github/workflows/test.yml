# GitHub Actions workflow for ha-intentional
#
# This file lives in ci/test.yml (not .github/workflows/) because
# the project's GitHub token doesn't have `workflow` scope. The
# user copies it to .github/workflows/test.yml once they grant the
# scope. See docs/ci-setup.md for full instructions.
#
# ─────────────────────────────────────────────────────────────────
# How to enable CI (one-time setup)
# ─────────────────────────────────────────────────────────────────
# 1. Grant the gh CLI token the `workflow` scope:
#      gh auth refresh -h github.com -s workflow
# 2. Push this file to its proper location:
#      mkdir -p .github/workflows
#      cp ci/test.yml .github/workflows/test.yml
#      git add .github/workflows/test.yml
#      git commit -m "Enable CI workflow"
#      git push
# 3. Watch the Actions tab on GitHub — first run takes ~5 minutes
#    (most of which is installing the full Home Assistant package).
# ─────────────────────────────────────────────────────────────────
#
# What this workflow does
# ────────────────────────
# 1. Lint               — ruff check on the engine + integration code
# 2. Unit + AST guards  — fast unit tests + the config-flow AST guards
# 3. Integration        — test_integration + test_api (real HA harness)
# 4. E2E config flow    — test_e2e_config_flow (real HA harness, separate
#                         pytest invocation; see test_e2e_config_flow.py
#                         docstring for why it must be a separate process)
# 5. Verify             — bundled engine matches the source
#
# Why three test jobs, not one
# ────────────────────────────
# v0.3.4 added test_e2e_config_flow.py. These tests must run in a
# SEPARATE pytest invocation from test_integration.py because
# ``pytest-homeassistant-custom-component`` ≥ 0.13.250 has a
# translation-cache singleton that pollutes across test files in
# the same process (see test_e2e_config_flow.py docstring for the
# root cause and the upstream HA issue). Running them in a
# separate `pytest` invocation is the simplest fix that doesn't
# require patching the test harness.
#
# Pinning the HA version
# ──────────────────────
# HA 2026.5 is the current stable as of writing. We pin to that
# explicitly so CI tests the same version users run, not whatever
# ``pytest-homeassistant-custom-component`` happens to pull. Bump
# this pin when doing a HA compatibility review. The
# ``test_e2e_config_flow.py`` tests catch the kinds of
# HA-version-specific config-flow bugs that bit us in v0.3.x
# (OptionsFlow.config_entry read-only property, invalid
# TextSelector keys, blocking I/O on the event loop).

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allow manual runs

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so version-cross-check tests can read tags
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the package in editable mode with all test deps
          # (unit + integration). The integration deps include
          # homeassistant, which is ~500MB — this is the slow step.
          pip install -e ".[all-tests]"
          # Pin the HA version explicitly. This is what catches
          # HA-version-specific config-flow bugs (see header comment).
          pip install "homeassistant==2026.5.1"
          # Pin the test harness to a known-good version
          pip install "pytest-homeassistant-custom-component==0.13.316"

      - name: Lint
        run: |
          ruff check src/ tests/ custom_components/intentional/

      - name: Verify bundled engine matches source
        run: |
          # Catch drift: the bundled engine subpackage must include
          # every file in src/intentional/. If they diverge, the
          # integration installed by HACS will be broken.
          python ci/check-bundle-sync.py

      - name: Run unit tests + AST guards
        # Fast: no HA needed, runs in seconds. Includes
        # test_config_flow_no_blocking_io.py which guards against
        # sync I/O in the config flow and invalid TextSelector
        # keys — both bugs we shipped in v0.3.x and don't want
        # to ship again.
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_integration.py \
            --ignore=tests/test_api.py \
            --ignore=tests/test_lifecycle_writer.py \
            --ignore=tests/test_rule_store.py \
            --ignore=tests/test_document_validation.py \
            --ignore=tests/test_e2e_config_flow.py \
            --ignore=tests/test_hacs_load.py

      - name: Run HACS smoke-load test
        # The HACS contract test: the integration must import
        # cleanly in a fresh subprocess with only
        # custom_components/ on sys.path. This is the test that
        # would have caught the v0.3.1 bare-import bug.
        run: |
          pytest tests/test_hacs_load.py -v --tb=short

      - name: Run integration tests
        # Integration tests need HA + pytest-homeassistant-custom-component.
        # They take a few minutes to start up; we run them after the fast
        # unit tests so failures surface quickly.
        env:
          INTENTIONAL_REQUIRE_HA_TESTS: "1"
        run: |
          pytest tests/test_api.py tests/test_integration.py \
            tests/test_lifecycle_writer.py tests/test_rule_store.py \
            tests/test_document_validation.py -v --tb=short

      - name: Run E2E config flow tests
        # These must be a separate pytest invocation from
        # test_integration.py — see test_e2e_config_flow.py
        # docstring for the pytest-homeassistant-custom-component
        # translation cache pollution issue. The ``-m
        # e2e_config_flow`` selector runs only the marked tests.
        env:
          INTENTIONAL_REQUIRE_HA_TESTS: "1"
        run: |
          pytest -m e2e_config_flow tests/test_e2e_config_flow.py -v --tb=short

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            .coverage
          if-no-files-found: ignore
