# Welcome to ha-intentional.
#
# Current installs store rules in Home Assistant storage. This file is kept as
# an importable starter example for users who seed /config/intentional/rules/
# before first setup.

- id: bedroom-off-at-23
  observe:
    input_boolean.intentional_example_enabled: "on"
  intent:
    light.bedroom:
      state: "off"
      ttl: 5m
      apply:
        transition:
          assert: 30s
  authority: automation
  reason: Example rule; create and enable input_boolean.intentional_example_enabled to try it
